      <button onclick="toggleCartModal(true)" class="flex shrink-0 items-center gap-2 rounded-full border border-[#E8A020]/40 bg-[#7B1213] px-3 py-2 text-xs font-black uppercase text-[#F5E6C8] transition hover:border-[#E8A020] sm:px-4 sm:py-2.5">

      <button onclick="sendWhatsApp()" id="btn-whatsapp-bar" disabled class="inline-flex shrink-0 items-center justify-center gap-1.5 rounded-lg bg-[#E8A020] px-3 py-2 text-xs font-black uppercase tracking-wide text-[#171313] transition hover:bg-[#F2B33A] disabled:cursor-not-allowed disabled:opacity-40">

      { id: "pa1", category: "Papas", name: "Clasiquitas", description: "300 grs de papas francesas, salchichas Wiener y salsas básicas.", price: 5.2 },
      { id: "pa2", category: "Papas", name: "Quesua", description: "300 grs de papas francesas, salchichas Wiener, maíz, queso amarillo y salsas básicas.", price: 6.9 },
      { id: "pa3", category: "Papas", name: "Chorreada", description: "300 grs de papas francesas, queso fundido, tocineta y topping de cebollín.", price: 8.5 },

      // PEPITOS
      { id: "pe1", category: "Pepitos", name: "Carne, Pollo o Mixto", description: "Pan de orégano tostado con ajo, 300grs de proteína, queso amarillo, tocineta, maíz, lechuga, tomate, papas hilo, salsas básicas.", price: 15.5 },

      { id: "s1", category: "Sanguches", name: "El Club de la Casa", description: "Sándwich estilo club house con jamón, queso, huevo, lechuga, tomate, salsas básicas, 150 grs de proteína (carne, pollo o krispy) + 200 grs de papas francesas.", price: 13.5 },

      // RACIONES & EXTRAS

      { id: "r2", category: "Raciones & Extras", name: "Tender + Papas Fritas", description: "Tenders de pollo acompañados con papas fritas.", price: 4.5 },
      { id: "r3", category: "Raciones & Extras", name: "Tequeyoyo", description: "Tequeyoyo tradicional.", price: 1.5 },
      { id: "r4", category: "Raciones & Extras", name: "Papas Fritas", description: "Ración adicional de papas fritas.", price: 1.0 },

      { id: "r6", category: "Raciones & Extras", name: "Extra de Pollo", description: "Porción adicional de pollo.", price: 2.0 },
      { id: "r7", category: "Raciones & Extras", name: "Extra de Krispy", description: "Porción adicional de pollo krispy.", price: 2.5 },
      { id: "r8", category: "Raciones & Extras", name: "Huevo", description: "Adicional de huevo.", price: 1.0 },
      { id: "r9", category: "Raciones & Extras", name: "Extra de Facilita", description: "Adicional de queso Kraft facilita.", price: 1.0 },
      { id: "r10", category: "Raciones & Extras", name: "Extra de Tocineta", description: "Porción adicional de tocineta.", price: 1.4 },
      { id: "r11", category: "Raciones & Extras", name: "Salchicha", description: "Adicional de salchicha.", price: 0.8 },

      // ENSALADAS
      { id: "e1", category: "Ensaladas", name: "César Pollo", description: "200grs de pollo a la plancha, lechuga, crutones, tocineta, aderezo césar.", price: 10.0 },
      { id: "e2", category: "Ensaladas", name: "César Krispy", description: "200grs de pollo krispy, lechuga, crutones, tocineta, aderezo césar.", price: 11.0 },

      // PARA TOMAR
      { id: "t1", category: "Para tomar", name: "Refresco 355ml", description: "Refresco individual de 355ml.", price: 1.2 },
      { id: "t2", category: "Para tomar", name: "Refresco 1Lt", description: "Refresco de 1 litro.", price: 2.0 },
      { id: "t3", category: "Para tomar", name: "Refresco 2Lt", description: "Refresco de 2 litros.", price: 3.5 },
      { id: "t4", category: "Para tomar", name: "Malta", description: "Malta fría.", price: 1.2 },
      { id: "t5", category: "Para tomar", name: "Agua", description: "Agua embotellada.", price: 1.0 },
      { id: "t6", category: "Para tomar", name: "Té", description: "Té frío.", price: 2.5 }
    ];

    const categories = [
      "Hamb. Carne",
      "Hamb. Pollo",
      "Súper Hamburguesas",
      "Hamb. Gourmets",
      "Perritos",
      "Papas",
      "Pepitos",
      "Sanguches",
      "Raciones & Extras",
      "Ensaladas",
      "Para tomar"
    ];

    const burgerCategories = [
      "Hamb. Carne",
      "Hamb. Pollo",
      "Súper Hamburguesas",
      "Hamb. Gourmets"
    ];

    let activeCategory = "Hamb. Carne";
    let cart = {};

    const formatCurrency = val => val == null ? "Consultar" : `$${val.toFixed(2)}`;

    function renderCategories() {
      const container = document.getElementById("categories-bar");
      container.innerHTML = categories.map(cat => {
        const active = cat === activeCategory;
        return `
          <button onclick="selectCategory('${cat}')" class="inline-flex items-center gap-2 rounded-full border px-4 py-2 text-xs font-black uppercase tracking-wider transition sm:text-sm ${
            active
              ? "border-[#E8A020] bg-[#E8A020] text-[#171313] shadow-md"
              : "border-[#F5E6C8]/15 bg-[#171313]/70 text-[#F5E6C8]/75 hover:border-[#E8A020]/45 hover:text-[#F5E6C8]"
          }">
            <span>${cat}</span>
          </button>
        `;
      }).join('');
    }

    function selectCategory(cat) {
      activeCategory = cat;
      renderCategories();
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById("products-grid");
      const filtered = products.filter(p => p.category === activeCategory);

      document.getElementById("cat-subtitle").innerText = activeCategory;
      document.getElementById("cat-count").innerText = `${filtered.length} ${filtered.length === 1 ? 'opción' : 'opciones'}`;

      const noticeEl = document.getElementById("burgers-notice");
      if (burgerCategories.includes(activeCategory)) {
        noticeEl.classList.remove("hidden");
      } else {
        noticeEl.classList.add("hidden");
      }

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full rounded-[28px] border border-[#E8A020]/20 bg-[#171313]/80 p-10 text-center">
            <h3 class="text-xl font-black uppercase text-[#F5E6C8]">Próximamente</h3>
            <p class="mt-2 text-sm text-[#F5E6C8]/55">Esta categoría estará disponible pronto con nuevos productos.</p>
          </div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const disabled = p.price == null;
        return `
          <article class="flex items-center gap-3 rounded-xl border border-[#D3A36E]/50 bg-[#F5E6C8] p-2.5 shadow-md transition hover:border-[#E8A020] sm:p-3">
            <div class="min-w-0 flex-1">
              <div class="flex items-baseline justify-between gap-3">
                <h3 class="truncate text-sm font-black uppercase leading-tight text-[#171313]">${p.name}</h3>
                <span class="shrink-0 text-sm font-black text-[#7B1213]">${formatCurrency(p.price)}</span>
              </div>
              <p class="mt-0.5 text-xs leading-snug text-[#500707]">${p.description}</p>
            </div>
            <button onclick="addToCart('${p.id}')" ${disabled ? 'disabled' : ''} class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg transition ${disabled ? 'bg-[#7B1213]/10 text-[#7B1213]/35 cursor-not-allowed' : 'bg-[#E8A020] text-[#171313] hover:bg-[#F2B33A]'}">
              <i class="fa-solid fa-plus text-xs"></i>
            </button>
          </article>
        `;
      }).join('');
    }

    function addToCart(id) {
      cart[id] = (cart[id] || 0) + 1;
      updateCartUI();
    }

    function changeQuantity(id, delta) {
      if (!cart[id]) return;
      cart[id] += delta;
      if (cart[id] <= 0) delete cart[id];
      updateCartUI();
    }

    function updateCartUI() {
      let count = 0;
      let total = 0;

      Object.keys(cart).forEach(id => {
        const item = products.find(p => p.id === id);
        if (item && item.price != null) {
          count += cart[id];
          total += item.price * cart[id];
        }
      });

      document.getElementById("badge-count").innerText = count;
      document.getElementById("bottom-cart-total").innerText = `$${total.toFixed(2)}`;
      document.getElementById("modal-cart-total").innerText = `$${total.toFixed(2)}`;
      document.getElementById("bottom-cart-label").innerText = count === 0 ? "Tu pedido está vacío" : `${count} ${count === 1 ? 'ítem' : 'ítems'}`;

      const disabled = count === 0;
      document.getElementById("btn-whatsapp-bar").disabled = disabled;
      document.getElementById("btn-whatsapp-modal").disabled = disabled;

      renderCartModalItems();
    }

    function renderCartModalItems() {
      const container = document.getElementById("modal-cart-items");
      const keys = Object.keys(cart);

      if (keys.length === 0) {
        container.innerHTML = `
          <div class="rounded-2xl border border-dashed border-[#E8A020]/20 bg-[#4E1111]/45 p-8 text-center">
            <p class="font-black uppercase text-[#F5E6C8]">Tu pedido está vacío.</p>
            <p class="mt-1 text-sm text-[#F5E6C8]/45">Agrega algo delicioso para comenzar.</p>
          </div>`;
        return;
      }

      container.innerHTML = keys.map(id => {
        const item = products.find(p => p.id === id);
        const qty = cart[id];
        const lineTotal = (item.price || 0) * qty;

        return `
          <div class="rounded-2xl border border-[#500707]/15 bg-[#FFFBEB] p-4 shadow-sm">
            <div class="flex items-start justify-between gap-4">
              <div>
                <h3 class="font-black uppercase text-[#500707]">${item.name}</h3>
                <p class="mt-1 text-xs font-medium text-[#500707]/70">$${(item.price || 0).toFixed(2)} c/u</p>
              </div>
              <p class="shrink-0 font-black text-[#500707]">$${lineTotal.toFixed(2)}</p>
            </div>
            <div class="mt-3 flex items-center justify-between">
              <div class="inline-flex items-center rounded-xl border border-[#500707]/20 bg-white p-1">
                <button onclick="changeQuantity('${id}', -1)" class="flex h-8 w-8 items-center justify-center rounded-lg text-[#500707] hover:bg-[#500707]/10"><i class="fa-solid fa-minus text-xs"></i></button>
                <span class="w-8 text-center text-sm font-black text-[#500707]">${qty}</span>
                <button onclick="changeQuantity('${id}', 1)" class="flex h-8 w-8 items-center justify-center rounded-lg text-[#500707] hover:bg-[#500707]/10"><i class="fa-solid fa-plus text-xs"></i></button>
              </div>
              <button onclick="changeQuantity('${id}', -${qty})" class="inline-flex items-center gap-1.5 rounded-xl px-3 py-2 text-xs font-bold text-[#500707] hover:bg-[#500707]/10">
                <i class="fa-solid fa-trash"></i> Eliminar
              </button>
            </div>
          </div>`;
      }).join('');
    }

    function toggleCartModal(show) {
      const modal = document.getElementById("cart-modal");
      if (show) {
        modal.classList.remove("hidden");
        modal.classList.add("flex");
        document.body.style.overflow = "hidden";
      } else {
        modal.classList.add("hidden");
        modal.classList.remove("flex");
        document.body.style.overflow = "unset";
      }
    }

    function sendWhatsApp() {
      const keys = Object.keys(cart);
      if (keys.length === 0) return;

      let total = 0;
      const lines = keys.map(id => {
        const item = products.find(p => p.id === id);
        const sub = (item.price || 0) * cart[id];
        total += sub;
        return `- ${cart[id]}x ${item.name} ($${sub.toFixed(2)})`;
      });

      const message = `¡Hola Cory Fast! Quisiera hacer el siguiente pedido:\n\n${lines.join('\n')}\n\n- Total a pagar: $${total.toFixed(2)}`;
      window.open(`https://wa.me/584120367308?text=${encodeURIComponent(message)}`, '_blank');
    }

    renderCategories();
    renderProducts();
    updateCartUI();
  </script>
</body>
</html>
